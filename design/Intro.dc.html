<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Break The Routine — Intro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&amp;display=swap">
<style>
@font-face{font-family:"PP Monument Extended";src:url("/_blob/18cdc448c0222c0f173be1ae5b1ef88b") format("woff2");font-weight:800 900;font-style:normal;font-display:swap}
@font-face{font-family:"PP Monument Extended";src:url("/_blob/3ba0618c1bf39385e530b4f4464382ce") format("woff2");font-weight:400;font-style:normal;font-display:swap}
body{margin:0;background:#080403}
a{color:#fecb7a}a:hover{color:#ffffff}
a:focus-visible,button:focus-visible{outline:3px solid #fecb7a;outline-offset:3px}
@keyframes btrIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes btrRule{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.btr-in-logo{animation:btrIn 900ms cubic-bezier(.2,.7,.2,1) both}.btr-in-rule{animation:btrRule 700ms 600ms cubic-bezier(.2,.7,.2,1) both}.btr-in-l1{animation:btrIn 800ms 900ms cubic-bezier(.2,.7,.2,1) both}.btr-in-l2{animation:btrIn 700ms 1700ms cubic-bezier(.2,.7,.2,1) both}.btr-in-cta{animation:btrIn 700ms 2300ms cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion: reduce){.btr-in-logo,.btr-in-rule,.btr-in-l1,.btr-in-l2,.btr-in-cta{animation:none}}
</style>
</helmet>
<div style="position: relative; height: 100vh; min-height: 560px; overflow: hidden; background: linear-gradient(180deg, rgba(8,4,3,0) 38%, rgba(159,137,69,0.22) 66%, rgba(223,191,100,0.62) 100%), radial-gradient(ellipse 70% 55% at 50% 42%, #1c110a 0%, #080403 72%); color: #ffffff; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-stretch: 108%;">
  <a href="{{lp}}Main.dc.html" aria-label="Enter the Break The Routine website" style="position: absolute; inset: 0; box-sizing: border-box; padding: 24px; display: flex; align-items: center; justify-content: center; color: #ffffff; text-decoration: none;">
    <sc-if value="{{show}}" hint-placeholder-val="{{true}}">
      <span style="display: flex; flex-direction: column; align-items: center; gap: 28px; max-width: 760px; text-align: center;">
        <img class="btr-in-logo" src="/_blob/11f81f408479a20d47ba1e740c14afea" alt="" style="width: min(440px, 70vw); height: auto; display: block;">
        <span class="btr-in-rule" aria-hidden="true" style="display: block; width: 64px; height: 2px; background: #fecb7a;"></span>
        <span class="btr-in-l1" style="display: block; font-family: 'PP Monument Extended', 'Arial Black', sans-serif; font-size: clamp(18px, 2.6vw, 30px); font-weight: 800; line-height: 1.2; color: #ffffff; text-wrap: balance;">DanceSport rarely talks about itself in the open.</span>
        <span class="btr-in-l2" style="display: block; font-family: 'PP Monument Extended', 'Arial Black', sans-serif; font-size: clamp(26px, 4vw, 48px); font-weight: 800; line-height: 1; color: #fecb7a;">We do.</span>
        <span class="btr-in-cta" style="display: inline-flex; align-items: center; gap: 10px; min-height: 48px; margin-top: 12px; padding: 0 24px; background: #fecb7a; color: #000000; font-family: 'PP Monument Extended', 'Arial Black', sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 0.06em;">ENTER WEBSITE<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M5 12h13M13 6l6 6-6 6"></path></svg></span>
      </span>
    </sc-if>
  </a>
  <button type="button" onClick="{{replay}}" aria-label="Replay the intro" style="position: absolute; left: clamp(16px, 4vw, 56px); bottom: 24px; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; background: transparent; border: 1px solid rgba(254,203,122,0.35); border-radius: 0; color: #c9b8a6; cursor: pointer;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { show: true };
  }
  renderVals() {
    return {
      lp: this.props.lp ?? '',
      show: this.state.show,
      replay: () => { this.setState({ show: false }); setTimeout(() => this.setState({ show: true }), 40); }
    };
  }
}
</script>
</body>
</html>
