# One-off: grab still frames from an episode for Instagram posts (runs on push to frames-* branches).
name: Episode frames
on:
  push:
    branches: ['frames-*']
permissions:
  contents: write
jobs:
  frames:
    runs-on: ubuntu-latest
    env:
      VID: PjDZ8X_JWY0
      # start-end windows (seconds), frames every second
      WINDOWS: "145-165 405-445 704-724 1283-1303 2050-2095 2125-2200 2891-2911 4133-4153 4647-4667 920-940"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q -U yt-dlp
      - name: Download windows and extract frames
        env:
          COOKIES: ${{ secrets.BOT_YT_COOKIES }}
        run: |
          printf '%s\n' "$COOKIES" > cookies.txt
          mkdir -p frames clips
          for w in $WINDOWS; do
            a=${w%-*}; b=${w#*-}
            yt-dlp -q --cookies cookies.txt -f "bv*[height<=1080][ext=mp4]/bv*[height<=1080]" \
              --download-sections "*${a}-${b}" --force-keyframes-at-cuts -o "clips/w${a}.%(ext)s" \
              "https://www.youtube.com/watch?v=$VID" >> frames/log.txt 2>&1 || echo "fail $w" >> frames/log.txt
            f=$(ls clips/w${a}.* 2>/dev/null | head -1)
            [ -n "$f" ] && ffmpeg -loglevel error -i "$f" -vf fps=1 -q:v 2 "frames/t${a}_%03d.jpg"
          done
          rm -f cookies.txt
          ls frames | wc -l
      - name: Save frames to the branch
        run: |
          mkdir -p tools/frames-out && mv frames/* tools/frames-out/
          git config user.name "btr-bot"; git config user.email "btr-bot@users.noreply.github.com"
          git add tools/frames-out && git commit -q -m "Frames for Instagram posts" && git push
