# One-off: grab still frames from an episode for Instagram posts (runs on push to frames-* branches).
name: Episode frames
on:
  push:
    branches: ['frames-*']
permissions:
  contents: write
jobs:
  frames:
    runs-on: ubuntu-latest
    env:
      VID: yO0vuX-Ygpc
      # start-end windows (seconds), frames every second
      WINDOWS: ""
      SCAN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q -U "yt-dlp[default]"
      - name: Download windows and extract frames
        env:
          COOKIES: ${{ secrets.BOT_YT_COOKIES }}
        run: |
          printf '%s\n' "$COOKIES" > cookies.txt
          mkdir -p frames clips
          for w in $WINDOWS; do
            a=${w%-*}; b=${w#*-}
            yt-dlp -q --remote-components ejs:github --cookies cookies.txt -f "bv*[height<=2160]" \
              --download-sections "*${a}-${b}" --force-keyframes-at-cuts -o "clips/w${a}.%(ext)s" \
              "https://www.youtube.com/watch?v=$VID" >> frames/log.txt 2>&1 || echo "fail $w" >> frames/log.txt
            f=$(ls clips/w${a}.* 2>/dev/null | head -1)
            [ -n "$f" ] && ffmpeg -loglevel error -i "$f" -vf fps=1 -q:v 2 "frames/t${a}_%03d.jpg"
          done
          rm -f cookies.txt
          ls frames | wc -l
      - name: Scan the whole episode (contact sheets, 1 frame every 15 s)
        if: env.SCAN == '1'
        env:
          COOKIES: ${{ secrets.BOT_YT_COOKIES }}
        run: |
          printf '%s\n' "$COOKIES" > cookies.txt
          mkdir -p frames/scan_${VID}
          yt-dlp -q --remote-components ejs:github --cookies cookies.txt -f "bv*[height<=360]" -o "clips/full.%(ext)s" \
            "https://www.youtube.com/watch?v=$VID" >> frames/log.txt 2>&1 || echo "fail scan" >> frames/log.txt
          f=$(ls clips/full.* | head -1)
          ffmpeg -loglevel error -i "$f" -vf "fps=1/15,scale=384:216,drawtext=text='%{eif\:t\:d}':x=6:y=6:fontsize=22:fontcolor=yellow:box=1:boxcolor=black@0.6,tile=6x8" -q:v 3 "frames/scan_${VID}/sheet_%02d.jpg"
          rm -f cookies.txt
          ls frames/scan_${VID}
      - name: Save frames to the branch
        run: |
          mkdir -p tools/frames-out && mv frames/* tools/frames-out/
          git config user.name "btr-bot"; git config user.email "btr-bot@users.noreply.github.com"
          git add tools/frames-out && git commit -q -m "Frames for Instagram posts" && git push
