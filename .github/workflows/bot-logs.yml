name: Bot logs
on:
  push:
    branches: [bot-logs]
permissions:
  contents: write
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HOST: ${{ secrets.BOT_SERVER_HOST }}
    steps:
      - name: SSH access
        env:
          KEY: ${{ secrets.BOT_SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          k=$(printf '%s' "$KEY" | tr -d '\r')
          case "$k" in *BEGIN*) ;; *) k=$(printf '%s' "$k" | tr -d ' \n\t' | base64 -d) ;; esac
          body=$(printf '%s' "$k" | sed -e 's/-----BEGIN OPENSSH PRIVATE KEY-----//' -e 's/-----END OPENSSH PRIVATE KEY-----//' | tr -d ' \n\t')
          { echo "-----BEGIN OPENSSH PRIVATE KEY-----"; printf '%s' "$body" | fold -w 70; echo; echo "-----END OPENSSH PRIVATE KEY-----"; } > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Memory
        run: |
          ssh root@"$HOST" 'journalctl -k --since "-3h" --no-pager | grep -iE "oom|killed process|invoked" | tail -20; ps aux --sort=-rss | head -8 | cut -c1-200'
          ssh root@"$HOST" 'swapon --show; free -m; ls -la /swapfile; grep swap /etc/fstab; systemctl show btr-bot -p MemoryMax -p MemoryHigh; cat /proc/sys/vm/swappiness; ls -t /opt/btr-bot/data/episodes | head -5; cat /opt/btr-bot/data/registry.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get(\"active\"), d.get(\"pending\"))"'
      - name: Thumbnail files
        run: |
          mkdir -p out
          ssh root@"$HOST" bash -s > out/thumbs.tgz <<'SH'
          A=$(python3 -c "import json; print(json.load(open('/opt/btr-bot/data/registry.json'))['active'])")
          cd /opt/btr-bot/data/episodes/$A
          tar czf - $(find . -maxdepth 3 \( -name "*cut*.png" -o -name "thumb_*.jpg" -o -name "*_bg.jpg" -o -name "*.html" -o -name "design*.json" -o -name "state.json" -o -name "*4k*.jpg" \) -newermt "-1 day" | head -80)
          SH
          ls -la out; tar tzf out/thumbs.tgz | head -80
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Push files to a branch
        run: |
          cd repo && git checkout --orphan bot-files && git rm -rfq . && mkdir f && tar xzf ../out/thumbs.tgz -C f
          git config user.email bot@local && git config user.name bot && git add f && git commit -qm files && git push -qf origin bot-files
