name: Bot logs
on:
  push:
    branches: [bot-logs]
permissions:
  contents: write
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HOST: ${{ secrets.BOT_SERVER_HOST }}
    steps:
      - name: SSH access
        env:
          KEY: ${{ secrets.BOT_SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          k=$(printf '%s' "$KEY" | tr -d '\r')
          case "$k" in *BEGIN*) ;; *) k=$(printf '%s' "$k" | tr -d ' \n\t' | base64 -d) ;; esac
          body=$(printf '%s' "$k" | sed -e 's/-----BEGIN OPENSSH PRIVATE KEY-----//' -e 's/-----END OPENSSH PRIVATE KEY-----//' | tr -d ' \n\t')
          { echo "-----BEGIN OPENSSH PRIVATE KEY-----"; printf '%s' "$body" | fold -w 70; echo; echo "-----END OPENSSH PRIVATE KEY-----"; } > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Dev clone (read only)
        run: |
          mkdir -p out
          ssh root@"$HOST" 'cd /opt/btr-src && git status | head -12; git log --oneline -4; git status --porcelain | head -20'
          ssh root@"$HOST" 'cd /opt/btr-src && git format-patch -1 25fce7f --stdout' > out/agent.patch || true
          ssh root@"$HOST" 'cd /opt/btr-src && git diff HEAD' > out/worktree.diff || true
          wc -l out/*
          tar czf out/thumbs.tgz -C out agent.patch worktree.diff
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Push files to a branch
        run: |
          cd repo && git checkout --orphan bot-files && git rm -rfq . && mkdir f && tar xzf ../out/thumbs.tgz -C f
          git config user.email bot@local && git config user.name bot && git add f && git commit -qm files && git push -qf origin bot-files
