name: Bot logs
on:
  push:
    branches: [bot-logs]
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HOST: ${{ secrets.BOT_SERVER_HOST }}
    steps:
      - name: SSH access
        env:
          KEY: ${{ secrets.BOT_SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          k=$(printf '%s' "$KEY" | tr -d '\r')
          case "$k" in *BEGIN*) ;; *) k=$(printf '%s' "$k" | tr -d ' \n\t' | base64 -d) ;; esac
          body=$(printf '%s' "$k" | sed -e 's/-----BEGIN OPENSSH PRIVATE KEY-----//' -e 's/-----END OPENSSH PRIVATE KEY-----//' | tr -d ' \n\t')
          { echo "-----BEGIN OPENSSH PRIVATE KEY-----"; printf '%s' "$body" | fold -w 70; echo; echo "-----END OPENSSH PRIVATE KEY-----"; } > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Journal
        run: |
          ssh root@"$HOST" "journalctl -u btr-bot --since '-90min' --no-pager -o cat" \
            | sed -E 's#/bot[0-9]+:[A-Za-z0-9_-]+/#/bot<hidden>/#g; s#(token|secret|key)=[^ &]*#\1=<hidden>#gI; s#sk-ant-[A-Za-z0-9_-]+#<hidden>#g' \
            | grep -v 'getUpdates\|Running job\|executed successfully\|HTTP Request' | grep -iE -B3 -A20 "agent|dev|claude code|Traceback|ERROR|WARNING" | tail -250
      - name: Claude CLI
        run: |
          ssh root@"$HOST" 'which claude; claude --version 2>&1 | head -3; df -h / | tail -1; free -m | head -2; ls -la /root/.claude 2>/dev/null | head; cat /opt/btr-bot/data/agent.json 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print({k:v for k,v in d.items() if k!=\"token\"})" 2>&1 | head -5'
      - name: Thumbnail files
        run: |
          mkdir -p out
          ssh root@"$HOST" 'cd /opt/btr-bot/data/episodes/qAk-Mqe6xoQ && ls -la && find . -maxdepth 3 \( -name "*cut*.png" -o -name "thumb_*.jpg" -o -name "*_bg.jpg" -o -name "*.html" -o -name "*.json" \) -newermt "-1 day" | head -60'
          ssh root@"$HOST" 'cd /opt/btr-bot/data/episodes/qAk-Mqe6xoQ && tar czf - $(find . -maxdepth 3 \( -name "*cut*.png" -o -name "thumb_*.jpg" -o -name "*_bg.jpg" -o -name "*.html" -o -name "design*.json" -o -name "state.json" \) | head -80)' > out/thumbs.tgz
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: thumbs
          path: out/
